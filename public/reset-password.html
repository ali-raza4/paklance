<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose a new password · Paklance</title>
<meta name="theme-color" content="#0B3B2D">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
.pa-pw { position: relative; }
.pa-pw .input { width: 100%; padding-right: 48px; box-sizing: border-box; }
.pa-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--pa-muted, #728076); display: grid; place-items: center; padding: 0; }
.pa-eye svg { width: 20px; height: 20px; }
.pa-eye:hover { color: #000; }
.pa-eye[aria-pressed="true"] { color: var(--pa-accent, #00A859); }
.pa-token-info { display: inline-block; background: #e8f5ed; color: #01411c; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-top: 6px; }
</style>
</head>
<body>
<main class="wrap" style="padding:56px 16px 80px;max-width:520px">
  <a class="logo" href="/" style="margin-bottom:22px"><svg class="logo-mark" aria-hidden="true" focusable="false" viewBox="0 0 64 64"><rect width="64" height="64" rx="14.5" fill="#0B3B2D"/><g transform="translate(11.52 11.52) scale(0.64)"><path d="M31 52 H10 A21 21 0 0 1 31 31 Z" fill="#FFFFFF"/><path d="M33 52 V31 A21 21 0 0 1 54 52 Z" fill="#12A56F"/><circle cx="19" cy="19" r="7.5" fill="#FFFFFF"/><circle cx="45" cy="19" r="7.5" fill="#12A56F"/></g></svg>Paklance</a>
  
  <form class="card" id="resetForm" novalidate>
    <span class="eyebrow">Account Security</span>
    <h1 style="font-size:24px;margin-top:8px">Choose a new password</h1>
    <p class="muted" style="margin-top:8px;font-size:14px" id="rpSubtitle">Use at least 8 characters, including a letter and a number.</p>
    <div id="rpAccountBadge" style="display:none;margin-top:6px;">
      <span class="pa-token-info" id="rpUserEmail"></span>
    </div>

    <div class="field" style="margin-top:18px">
      <label for="rpPw">New password</label>
      <div class="pa-pw">
        <input class="input" id="rpPw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <button class="pa-eye" type="button" data-pa-eye="rpPw" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="field" style="margin-top:14px">
      <label for="rpPw2">Confirm new password</label>
      <div class="pa-pw">
        <input class="input" id="rpPw2" type="password" autocomplete="new-password" placeholder="Confirm your new password" required>
        <button class="pa-eye" type="button" data-pa-eye="rpPw2" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <p class="alert alert-warn" id="rpErr" role="alert" hidden style="margin-top:14px"></p>
    <button class="btn btn-primary btn-block" id="rpSubmitBtn" type="submit" style="margin-top:20px">Save new password</button>
    
    <div id="rpInvalidAction" hidden style="margin-top:14px;text-align:center;">
      <a class="btn btn-outline btn-block" href="/#auth">Request a new reset link</a>
    </div>
  </form>

  <div class="card" id="resetDone" hidden>
    <span class="eyebrow">Account</span>
    <h1 style="font-size:24px;margin-top:8px">Password updated</h1>
    <p class="muted" style="margin-top:8px;font-size:14px">Your password has been successfully reset. You can now sign in with your new password.</p>
    <a class="btn btn-primary btn-block" href="/#auth" style="margin-top:20px">Log in to your account</a>
  </div>
</main>
<script src="/assets/js/reset.js"></script>
</body>
</html>
