<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose a new password · Paklance</title>
<meta name="theme-color" content="#0B3B2D">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<main class="wrap" style="padding:56px 16px 80px;max-width:520px">
  <a class="logo" href="/" style="margin-bottom:22px"><svg class="logo-mark" aria-hidden="true" focusable="false" viewBox="0 0 64 64"><rect width="64" height="64" rx="14.5" fill="#0B3B2D"/><g transform="translate(11.52 11.52) scale(0.64)"><path d="M31 52 H10 A21 21 0 0 1 31 31 Z" fill="#FFFFFF"/><path d="M33 52 V31 A21 21 0 0 1 54 52 Z" fill="#12A56F"/><circle cx="19" cy="19" r="7.5" fill="#FFFFFF"/><circle cx="45" cy="19" r="7.5" fill="#12A56F"/></g></svg>Paklance</a>
  <form class="card" id="resetForm" novalidate>
    <span class="eyebrow">Account</span>
    <h1 style="font-size:24px;margin-top:8px">Choose a new password</h1>
    <p class="muted" style="margin-top:8px;font-size:14px">Use at least 8 characters, including a letter and a number.</p>
    <div class="field" style="margin-top:18px"><label for="rpPw">New password</label><input class="input" id="rpPw" type="password" autocomplete="new-password" required></div>
    <div class="field" style="margin-top:12px"><label for="rpPw2">Confirm new password</label><input class="input" id="rpPw2" type="password" autocomplete="new-password" required></div>
    <p class="alert alert-warn" id="rpErr" role="alert" hidden style="margin-top:14px"></p>
    <button class="btn btn-primary btn-block" type="submit" style="margin-top:18px">Save new password</button>
  </form>
  <div class="card" id="resetDone" hidden>
    <span class="eyebrow">Account</span>
    <h1 style="font-size:24px;margin-top:8px">Password updated</h1>
    <p class="muted" style="margin-top:8px;font-size:14px">You’re signed in. Other devices have been signed out.</p>
    <a class="btn btn-primary btn-block" href="/#dashboard" style="margin-top:18px">Go to your dashboard</a>
  </div>
</main>
<script src="/assets/js/reset.js"></script>
</body>
</html>
